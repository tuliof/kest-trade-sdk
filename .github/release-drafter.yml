name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "📚 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "🧹 Chores & Dependencies"
    labels:
      - "chore"
      - "dependencies"
      - "npm"
      - "github-actions"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
  default: patch

autolabeler:
  - label: "chore"
    files:
      - "*.md"
      - "*.json"
      - ".editorconfig"
      - ".github/**"
    branch:
      - '/chore\/.+/'
      - '/deps{0,1}\/.+/'
  - label: "bug"
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix(\(.+\))?:/i'
  - label: "feature"
    branch:
      - '/feat(ure)?\/.+/'
    title:
      - '/^feat(\(.+\))?:/i'
  - label: "dependencies"
    files:
      - "package.json"
      - "bun.lock"
    title:
      - '/^chore(\(deps\))?:/i'

template: |
  ## Changes

  $CHANGES
